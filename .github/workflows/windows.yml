name: windows

on:
  push:
    branches:
      - main
      - master
      - windows-support
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure
        run: cmake -S . -B build/windows -G Ninja

      - name: Build
        run: cmake --build build/windows

      - name: Frame Output
        run: .\build\windows\flecs.exe --frame-out .\build\windows\frame-out.ppm --scene .\etc\scenes\empty.flecs

      - name: Upload Frame Output
        uses: actions/upload-artifact@v4
        with:
          name: windows-frame-output
          path: build/windows/frame-out.ppm
